<!-- ===================================
     Floating Chat Button Widget
     Isko apni website ke </body> tag se
     thodi pehle paste kar dena
=================================== -->

<style>
  .chat-float-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 72px;
    height: 72px;
    background: #3a3a3a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 9999;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .chat-float-btn:hover {
    background: #222;
    transform: scale(1.08);
  }

  .chat-float-btn svg {
    width: 34px;
    height: 34px;
    fill: none;
    stroke: #ffffff;
  }

  /* Chat popup box jo click karne par khulega */
  .chat-popup {
    position: fixed;
    bottom: 92px;
    right: 24px;
    width: 300px;
    max-width: 90vw;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: sans-serif;
  }

  .chat-popup.active {
    display: flex;
  }

  .chat-popup-header {
    background: #3a3a3a;
    color: #fff;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .chat-popup-header .close-btn {
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }

  .chat-popup-body {
    padding: 16px;
    font-size: 14px;
    color: #333;
    line-height: 1.5;
  }

  .chat-popup-body a {
    display: inline-block;
    margin-top: 10px;
    background: #25D366;
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
  }
</style>

<!-- Floating Button -->
<div class="chat-float-btn" onclick="toggleChatPopup()">
  <svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="13" rx="6.5" ry="6.5"></rect>
    <path d="M9 21l3-4h1"></path>
  </svg>
</div>

<!-- Chat Popup -->
<div class="chat-popup" id="chatPopup">
  <div class="chat-popup-header">
    <span>Chat with us</span>
    <span class="close-btn" onclick="toggleChatPopup()">&times;</span>
  </div>
  <div class="chat-popup-body">
    Hi there 👋 <br>
    Have any questions? Message us directly on WhatsApp.
    <br>
    <a href="https://wa.me/919116849996" target="_blank">Chat on WhatsApp</a>
  </div>
</div>

<script>
  function toggleChatPopup() {
    const popup = document.getElementById('chatPopup');
    popup.classList.toggle('active');
  }
</script>
